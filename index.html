<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kassza – bevétel és kiadás</title>
  <meta name="theme-color" content="#071d19">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kassza">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Kezdőképernyő: indításkor kb. 2 mp-ig látszik, aztán elhalványul. Közvetlenül a HTML-ben van,
       hogy már a programfájlok betöltése előtt megjelenjen. -->
  <div id="splash" aria-hidden="true">
    <div class="splash-inner">
      <img src="icons/splash.webp" alt="" width="640" height="640" decoding="async" fetchpriority="high">
      <p class="splash-name">Kassza</p>
      <p class="splash-tag">Bevétel · Kiadás · Egyenleg</p>
    </div>
  </div>
  <script>
    (function () {
      var s = document.getElementById('splash');
      var hide = function () {
        s.classList.add('out');
        setTimeout(function () { s.remove(); }, 450);
      };
      setTimeout(hide, 2000);
      s.addEventListener('click', hide); // koppintásra azonnal eltűnik
    })();
  </script>

  <header class="top">
    <button type="button" class="icon-btn" data-tab="settings" aria-label="Beállítások" title="Beállítások">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></svg>
    </button>
    <div class="top-mid">
      <h1 id="title">Kassza</h1>
      <p class="top-month" id="top-month"></p>
      <p class="top-sync" id="top-sync"></p>
    </div>
    <button type="button" class="icon-btn" id="refresh" aria-label="Frissítés" title="Frissítés">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"/></svg>
    </button>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabs" aria-label="Fő navigáció">
    <button type="button" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="8" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="5" rx="1.5"/><rect x="4" y="15" width="6.5" height="5" rx="1.5"/><rect x="13.5" y="12" width="6.5" height="8" rx="1.5"/></svg>
      <span>Főoldal</span>
    </button>
    <button type="button" data-tab="day">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>
      <span>Napi</span>
    </button>
    <button type="button" data-tab="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <span>Keresés</span>
    </button>
    <button type="button" data-tab="month">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12v17l-3-2-3 2-3-2-3 2zM9 8.5h6M9 12h6"/></svg>
      <span>Havi</span>
    </button>
    <button type="button" data-tab="charts">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
      <span>Grafikon</span>
    </button>
    <button type="button" data-tab="todos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="M8 9l1.5 1.5L12 8M8 15l1.5 1.5L12 14M14.5 9.5H16M14.5 15.5H16"/></svg>
      <span>Teendők</span>
    </button>
    <button type="button" data-tab="calendar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M7.5 14h.01M12 14h.01M16.5 14h.01M7.5 17.5h.01M12 17.5h.01"/></svg>
      <span>Naptár</span>
    </button>
  </nav>

  <!-- Lebegő + gomb: új bevétel / kiadás rögzítése (a listanézetekben látszik). -->
  <button type="button" class="fab" id="fab" aria-label="Új tétel rögzítése" hidden>+</button>

  <div id="toast" role="status" aria-live="polite"></div>

  <dialog id="confirm" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="dialog-actions">
        <button class="btn ghost" value="cancel">Mégse</button>
        <button class="btn danger" id="confirm-ok" value="ok"></button>
      </div>
    </form>
  </dialog>

  <dialog id="info" aria-labelledby="info-title">
    <form method="dialog">
      <h2 id="info-title"></h2>
      <p id="info-text"></p>
      <ul class="info-list" id="info-list"></ul>
      <button class="btn primary" id="info-ok" value="ok">Bezárás</button>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
